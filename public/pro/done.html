<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Stripe Checkout's success page (?session_id=...#<calendar>). No analytics here and no referrer
     sent on, so the Checkout session id is never recorded; the query is cleared on load.
     The lock lands when Stripe's webhook does, which can be a few seconds after this page opens,
     so it polls /api/pro/status before making the first editor link. -->
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Pro is on · pastecal</title>
<link rel="icon" href="/favicon.ico">
<script>
  var proCalendar = null;
  try { proCalendar = decodeURIComponent(location.hash.slice(1)) || null; } catch (e) { proCalendar = null; }
  history.replaceState(null, '', location.pathname);
</script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root { --bg: #f5f6f8; --surface: #ffffff; --ink: #141a24; --muted: #5c6577; --line: #e2e6ed; --field: #c9ccd2; --blue: #2563eb; --bad: #b42318; --ok: #1f7a4d;
  --ui: "Figtree", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
@media (prefers-color-scheme: dark) { :root { --bg: #0f131a; --surface: #171c25; --ink: #e8ecf3; --muted: #9aa4b5; --line: #2a3140; --field: #3a4252; --blue: #3b6fe0; --bad: #ff8a80; --ok: #6fd49c; color-scheme: dark } }
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--ui); }
main { max-width: 480px; margin: 12vh auto 0; padding: 32px 28px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
h1 { font-size: 24px; margin: 0 0 6px; display: flex; align-items: center; gap: 10px }
h1 svg { width: 22px; height: 22px; color: var(--ok); flex-shrink: 0 }
h2 { font-size: 16px; margin: 24px 0 4px }
p { margin: 8px 0; color: var(--muted); }
p.bad { color: var(--bad); }
.cal { color: var(--ink); font-weight: 600 }
.row { display: flex; gap: 8px; margin-top: 10px }
.row input { flex: 1; min-width: 0; height: 40px; padding: 0 10px; border: 1px solid var(--field); border-radius: 8px; background: var(--bg); color: var(--ink); font: 13px var(--mono) }
button, a.btn { display: inline-flex; align-items: center; justify-content: center; height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--blue); background: var(--blue); color: #fff; font: 600 15px var(--ui); text-decoration: none; cursor: pointer; white-space: nowrap }
a.btn { margin-top: 24px }
.small { font-size: 14px }
[hidden] { display: none !important }
@media (max-width: 520px) { main { margin: 16px; padding: 24px 20px } }
</style>
</head>
<body>
<main>
  <h1><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><span id="title">Pro is on</span></h1>
  <p id="msg">Your payment went through. Locking <span class="cal" id="calname">your calendar</span>…</p>

  <section id="linkbox" hidden>
    <h2>Your editor link</h2>
    <p class="small">Share this with people who should be able to edit. Anyone else sees a read-only calendar.</p>
    <div class="row">
      <input id="link" type="text" readonly aria-label="Editor link">
      <button id="copy" type="button">Copy</button>
    </div>
    <p class="small">You can make a new one any time from Share on your calendar. Making a new link turns off the old one.</p>
  </section>

  <a class="btn" id="go" href="/">Back to your calendar</a>
</main>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var go = $('go'), msg = $('msg');
  if (!proCalendar) {
    $('title').textContent = 'Thanks, your payment went through';
    msg.textContent = 'Open your calendar and press Share to see its Pro settings.';
    go.textContent = 'Back to pastecal';
    return;
  }
  var calPath = '/' + encodeURIComponent(proCalendar);
  go.href = calPath;
  $('calname').textContent = proCalendar;

  function api(method, path, body) {
    var init = { method: method, credentials: 'same-origin', headers: {} };
    if (body) { init.headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(body); }
    return fetch(path, init).then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { return { status: r.status, data: d }; }); },
      function () { return { status: 0, data: {} }; });
  }

  function locked() {
    var span = document.createElement('span'); span.className = 'cal'; span.textContent = proCalendar;
    msg.textContent = ''; msg.append(span, ' is locked. Only you and people with your editor link can change it.');
    // Reloading this page must not reset a link the owner may already have sent out.
    var shown = null;
    try { shown = localStorage.getItem('pastecal_editor_link:' + proCalendar.toLowerCase()); } catch (e) { shown = null; }
    if (shown) { $('link').value = shown; $('linkbox').hidden = false; return; }
    api('POST', '/api/pro/editor-key', { calendarId: proCalendar }).then(function (r) {
      if (r.status === 200 && r.data.editorKey) {
        var link = 'https://pastecal.com' + calPath + '#k=' + r.data.editorKey;
        try { localStorage.setItem('pastecal_editor_link:' + proCalendar.toLowerCase(), link); } catch (e) { /* shown here anyway */ }
        $('link').value = link;
        $('linkbox').hidden = false;
        return;
      }
      if (r.status === 401) msg.append(' Sign in from your calendar’s Share panel to make an editor link.');
      else msg.append(' Make an editor link from your calendar’s Share panel.');
    });
  }

  // The webhook may land a few seconds after Stripe sends people here: ask every 1.5s for up to ~20s.
  var tries = 0;
  (function poll() {
    api('GET', '/api/pro/status?calendar=' + encodeURIComponent(proCalendar)).then(function (r) {
      if (r.status === 200 && r.data.locked) return locked();
      if (++tries < 14) return setTimeout(poll, 1500);
      $('title').textContent = 'Still setting up';
      msg.textContent = 'Your payment went through, and the lock is still on its way. Refresh this page in a minute, or open your calendar and press Share.';
    });
  })();

  $('copy').addEventListener('click', function () {
    var input = $('link'), btn = this;
    function selectIt() { input.focus(); input.select(); btn.textContent = 'Press ⌘C / Ctrl+C'; }
    try {
      navigator.clipboard.writeText(input.value).then(function () { btn.textContent = 'Copied'; setTimeout(function () { btn.textContent = 'Copy'; }, 2000); }, selectIt);
    } catch (e) { selectIt(); }
  });
})();
</script>
</body>
</html>
