<!DOCTYPE html>
<html lang="en">
<!--
  pastecal design system -- /dev/design

  A living gallery, generated from the real CSS: it reads /tokens.css and /components.css at
  run time, lists every token and every .pc-* component variant it finds, and draws each one
  twice, in a light pane and a dark pane. Nothing is typed in here, so it cannot drift.
  The rules and the inventory are in docs/DESIGN-SYSTEM.md.
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>pastecal design system</title>
    <link rel="icon" type="image/svg+xml" href="/img/icons/favicon.svg" />
    <link rel="stylesheet" href="/tokens.css">
    <link rel="stylesheet" href="/components.css">
    <style>
        body { margin: 0; background: var(--pc-soft); color: var(--pc-text); font: var(--pc-fs-md)/1.5 var(--pc-font) }
        .page { max-width: var(--pc-page-max); margin: 0 auto; padding: var(--pc-space-8) var(--pc-space-4) var(--pc-space-12) }
        h1 { margin: 0; font-size: var(--pc-fs-3xl) }
        .lead { margin: var(--pc-space-1) 0 var(--pc-space-8); color: var(--pc-text-muted) }
        h2 { margin: var(--pc-space-10) 0 var(--pc-space-3); font-size: var(--pc-fs-xl) }
        .panes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--pc-space-4) }
        .pane { padding: var(--pc-space-5); border: 1px solid var(--pc-line); border-radius: var(--pc-radius-card); background: var(--pc-bg); color: var(--pc-text) }
        .row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--pc-space-3); padding: var(--pc-space-2) 0 }
        .row + .row { border-top: 1px solid var(--pc-line) }
        .name { flex: 0 0 100%; font: var(--pc-fw-medium) var(--pc-fs-xs) var(--pc-font-mono); color: var(--pc-text-muted) }
        .sw { display: grid; gap: 2px; width: 104px; font-size: var(--pc-fs-xs); color: var(--pc-text-muted) }
        .sw i { height: 36px; border-radius: var(--pc-radius-control); box-shadow: inset 0 0 0 1px var(--pc-line) }
        .sz b { display: block; color: var(--pc-text) }
        .rad i { display: block; width: 56px; height: 40px; border: 1px solid var(--pc-field); background: var(--pc-soft) }
        .shd i { display: block; width: 96px; height: 56px; border-radius: var(--pc-radius-card); background: var(--pc-bg) }
        @media (max-width: 760px) { .panes { grid-template-columns: minmax(0, 1fr) } }
    </style>
</head>
<body>
<main class="page">
    <h1>pastecal design system</h1>
    <p class="lead">Every token in tokens.css and every component variant in components.css, read from the live files. Left light, right dark.</p>
    <div id="out"></div>
</main>
<script>
(async function () {
    // One sample per component. A variant is drawn by adding its class to the sample's root.
    // test/unit/design-guards.test.js fails when components.css gains a component with no sample here.
    var SAMPLES = {
        'pc-btn': function (v) { return '<button type="button" class="pc-btn ' + v + '">' + (/icon/.test(v) ? '+' : 'Button') + '</button>'; },
        'pc-link': function (v) { return '<a href="#" class="pc-link ' + v + '">A text link</a>'; },
        'pc-field': function (v) { return '<input class="pc-field ' + v + '" placeholder="A field" style="max-width:220px">'; },
        'pc-field-group': function (v) { return '<label class="pc-field-group ' + v + '" style="max-width:280px"><span class="pc-field-prefix">pastecal.com/</span><input class="pc-field" value="tigers"></label>'; },
        'pc-chip': function (v) { return '<button type="button" class="pc-chip ' + v + '" style="--dot: var(--pc-event-2)">Sports team</button>'; },
        'pc-pill': function (v) { return '<span class="pc-pill ' + v + '">' + (v.replace('pc-pill--', '') || 'neutral') + '</span>'; },
        'pc-card': function (v) { return '<div class="pc-card ' + v + '" style="padding:12px;width:200px">A card</div>'; },
        'pc-eyebrow': function (v) { return '<p class="pc-eyebrow ' + v + '">This calendar</p>'; },
        'pc-section-title': function (v) { return '<h3 class="pc-section-title ' + v + '">Section title</h3>'; },
        'pc-empty': function (v) { return '<p class="pc-empty ' + v + '">Nothing here yet.</p>'; },
        'pc-tabs': function (v) { return '<div class="pc-tabs ' + v + '" role="tablist" style="height:36px"><button class="pc-tab" role="tab" aria-selected="true">Notes</button><button class="pc-tab" role="tab" aria-selected="false">Share</button><button class="pc-tab" role="tab" aria-selected="false">Activity</button></div>'; },
        'pc-seg': function (v) { return '<div class="pc-seg ' + v + '"><button class="pc-seg-btn on">Views</button><button class="pc-seg-btn">Visitors</button></div>'; },
        'pc-toggle': function (v) { return '<label class="pc-toggle ' + v + '"><input type="checkbox" checked><span class="pc-toggle-track"></span> A toggle</label>'; },
        'pc-kbd': function (v) { return '<span class="pc-kbd ' + v + '">⌘E</span>'; },
        'pc-link-field': function (v) { return '<button type="button" class="pc-link-field ' + v + '" style="max-width:280px"><span class="pc-link-url">pastecal.com/tigers</span><span class="pc-link-act">⧉</span></button>'; },
        'pc-modal': function (v) { return '<div class="pc-modal-panel ' + v + '" style="position:static">A dialog panel</div>'; },
        'pc-menu': function (v) { return '<div class="pc-menu ' + v + '" style="width:180px"><button class="pc-menu-item">Search</button><button class="pc-menu-item">Settings</button></div>'; },
        'pc-swatch': function (v) { return '<button class="pc-swatch is-selected ' + v + '" style="background:var(--pc-event-1)"></button><button class="pc-swatch" style="background:var(--pc-event-8)"></button>'; },
        'pc-scrim': function () { return '<div class="pc-scrim" style="width:120px;height:40px;border-radius:var(--pc-radius-control)"></div>'; },
    };
    var [tokens, comps] = await Promise.all(['/tokens.css', '/components.css'].map(function (u) { return fetch(u).then(function (r) { return r.text(); }); }));
    var css = comps.replace(/\/\*[\s\S]*?\*\//g, '');
    // Components and their --variants, in file order.
    var found = {};
    (css.match(/\.pc-[a-z-]+/g) || []).forEach(function (sel) {
        var name = sel.slice(1), m = name.match(/^(pc-[a-z-]+?)--([a-z-]+)$/);
        var base = m ? m[1] : name;
        if (!SAMPLES[base]) return;   // parts (pc-tab, pc-field-prefix...) are drawn inside their component
        (found[base] = found[base] || new Set());
        if (m) found[base].add(name);
    });
    var root = tokens.slice(tokens.indexOf(':root {'), tokens.indexOf('\n}', tokens.indexOf(':root {'))).replace(/\/\*[\s\S]*?\*\//g, '');
    var names = (root.match(/--pc-[\w-]+(?=\s*:)/g) || []);
    var colors = names.filter(function (n) { return !/fs-|fw-|lh-|tracking|space-|h-|radius-|shadow-|dur|ease|z-|font|tint|page-max|focus|scrim/.test(n); });
    function section(title, inner) {
        return '<h2>' + title + '</h2><div class="panes"><div class="pane" data-theme="light">' + inner + '</div><div class="pane" data-theme="dark">' + inner + '</div></div>';
    }
    var html = '';
    Object.keys(found).forEach(function (base) {
        var vs = [''].concat(Array.from(found[base]));
        html += section('.' + base, vs.map(function (v) { return '<div class="row"><span class="name">.' + base + (v ? ' .' + v : '') + '</span>' + SAMPLES[base](v) + '</div>'; }).join(''));
    });
    html += section('Color tokens', '<div class="row">' + colors.map(function (n) { return '<span class="sw"><i data-p="background" data-v="' + n + '"></i>' + n.slice(5) + '</span>'; }).join('') + '</div>');
    html += section('Type scale', names.filter(function (n) { return /^--pc-fs-/.test(n); }).map(function (n) { return '<div class="row sz"><span class="name">' + n + '</span><b data-p="font-size" data-v="' + n + '">Shared calendars, refreshingly simple.</b></div>'; }).join(''));
    html += section('Radius', '<div class="row">' + names.filter(function (n) { return /^--pc-radius-/.test(n); }).map(function (n) { return '<span class="sw rad"><i data-p="border-radius" data-v="' + n + '"></i>' + n.slice(5) + '</span>'; }).join('') + '</div>');
    html += section('Elevation (floating things only)', '<div class="row">' + names.filter(function (n) { return /^--pc-shadow-/.test(n); }).map(function (n) { return '<span class="sw shd"><i data-p="box-shadow" data-v="' + n + '"></i>' + n.slice(5) + '</span>'; }).join('') + '</div>');
    document.getElementById('out').innerHTML = html;
    // Each token sample shows its own token (set here, so the page's CSS stays on the scale).
    document.querySelectorAll('[data-v]').forEach(function (el) { el.style.setProperty(el.dataset.p, 'var(' + el.dataset.v + ')'); });
})();
</script>
</body>
</html>
