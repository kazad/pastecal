<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The sign-in link carries its token in the #fragment. No analytics here, no referrer sent on,
     and the fragment is cleared before anything else runs, so the token is never recorded.
     Opening the link never signs anyone in by itself: the page asks /api/auth/peek which email the
     link is for, and only a click on Continue uses it (/api/auth/verify). Someone else's link, sent
     to you, cannot quietly sign you in to their account, and link scanners don't use it up. -->
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Sign in · pastecal</title>
<link rel="icon" href="/favicon.ico">
<script>
  var signinToken = (location.hash.match(/[#&]t=([A-Za-z0-9_-]+)/) || [])[1] || null;
  if (location.hash) history.replaceState(null, '', location.pathname);
</script>
<style>
:root { --bg: #f5f6f8; --surface: #ffffff; --ink: #141a24; --muted: #5c6577; --line: #e2e6ed; --blue: #2563eb; --bad: #b42318;
  --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
@media (prefers-color-scheme: dark) { :root { --bg: #0f131a; --surface: #171c25; --ink: #e8ecf3; --muted: #9aa4b5; --line: #2a3140; --blue: #6b9bff; --bad: #ff8a80; } }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--ui); }
main { max-width: 420px; margin: 12vh auto 0; padding: 32px 24px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
h1 { font-size: 22px; margin: 0 0 8px; }
p { margin: 8px 0; color: var(--muted); }
p.bad { color: var(--bad); }
a.btn, button.btn { display: inline-block; margin-top: 16px; padding: 10px 16px; border-radius: 8px; border: 0; background: var(--blue); color: #fff; text-decoration: none; font: 600 16px var(--ui); cursor: pointer; }
button.btn[disabled] { opacity: .6; cursor: default; }
.who { color: var(--ink); font-weight: 600; word-break: break-all; }
[hidden] { display: none !important; }
@media (max-width: 480px) { main { margin: 24px 16px; } }
</style>
</head>
<body>
<main>
  <h1 id="title">Sign in</h1>
  <p id="msg">One moment.</p>
  <button class="btn" id="confirm" type="button" hidden>Continue</button>
  <a class="btn" id="go" href="/" hidden>Continue</a>
</main>
<script>
(function () {
  var title = document.getElementById('title'), msg = document.getElementById('msg'), go = document.getElementById('go'), confirm = document.getElementById('confirm');
  function fail(text) { title.textContent = 'That link didn’t work'; msg.textContent = text; msg.className = 'bad'; confirm.hidden = true; go.textContent = 'Back to pastecal'; go.hidden = false; }
  function post(path) {
    return fetch(path, { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token: signinToken }) })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); });
  }
  var offline = function () { fail('We couldn’t reach pastecal. Check your connection and open the link again.'); };
  if (!signinToken) return fail('This page needs the link from your sign-in email. Open the email and tap the link again.');
  post('/api/auth/peek').then(function (res) {
    if (!res.ok || !res.d.ok) return fail(res.d.error || 'Ask for a new sign-in link and try again.');
    var who = document.createElement('span'); who.className = 'who'; who.textContent = res.d.email;
    who.setAttribute('data-hj-suppress', ''); who.setAttribute('data-clarity-mask', 'true');
    msg.textContent = ''; msg.append('Sign in to pastecal as ', who, '?');
    confirm.hidden = false; confirm.focus();
  }).catch(offline);
  confirm.addEventListener('click', function () {
    confirm.disabled = true; confirm.textContent = 'Signing in…';
    post('/api/auth/verify').then(function (res) {
      if (!res.ok || !res.d.ok) return fail(res.d.error || 'Ask for a new sign-in link and try again.');
      confirm.hidden = true;
      title.textContent = 'You’re signed in';
      msg.textContent = 'You’re signed in.';
      go.href = res.d.next || '/';
      go.hidden = false;
      if (res.d.next) location.replace(res.d.next);
    }).catch(offline);
  });
})();
</script>
<script src="/utils/preview.js"></script>
</body>
</html>
